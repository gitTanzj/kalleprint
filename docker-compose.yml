services:
  db:
    image: mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kalleprint
    ports:
      - "3306:3306"
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
      args:
        PRUSA_APPIMAGE_URL: "https://github.com/prusa3d/PrusaSlicer/releases/download/version_2.8.1/PrusaSlicer-2.8.1+linux-x64-newer-distros-GTK3-202409181416.AppImage"
    restart: on-failure
    volumes:
      - ./server:/app
      - /var/kalleprint:/var/kalleprint
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: kalleprint
      STORAGE_DIR: /var/kalleprint
    depends_on:
      db:
        condition: service_healthy
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    restart: on-failure
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://127.0.0.1:8080
    depends_on:
      - api
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    restart: on-failure
    volumes:
      - ./admin:/app
      - /app/node_modules
    ports:
      - "3001:3000"
    environment:
      VITE_API_URL: http://127.0.0.1:8080
    depends_on:
      - api
volumes:
   db_data:
