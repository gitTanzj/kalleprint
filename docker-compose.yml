services:
  db:
    image: mysql
    restart: always
    healthcheck:
      test: "exit 0"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kalleprint
    ports:
      - "3306:3306"
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    restart: on-failure
    volumes:
      - ./server:/app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: kalleprint
    depends_on:
      - db
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    restart: on-failure
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://127.0.0.1:8080
    depends_on:
      - api

volumes:
   db_data:
