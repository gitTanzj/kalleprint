# Creality K1 printer profile (0.4 mm nozzle, Klipper).
# Loaded first; the print profile and the per-filament INI override it.
printer_technology = FFF
printer_notes = KALLEPRINT_K1
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 250
z_offset = 0
gcode_flavor = klipper
binary_gcode = 0
use_relative_e_distances = 1
use_firmware_retraction = 0
nozzle_diameter = 0.4
min_layer_height = 0.08
max_layer_height = 0.32
retract_length = 0.8
retract_speed = 40
deretract_speed = 0
retract_lift = 0.2
retract_lift_above = 0
retract_lift_below = 249
retract_before_travel = 1.5
retract_layer_change = 1
wipe = 0
extruder_clearance_height = 25
extruder_clearance_radius = 45
machine_limits_usage = time_estimate_only
machine_max_acceleration_extruding = 20000
machine_max_acceleration_retracting = 5000
machine_max_acceleration_travel = 20000
machine_max_acceleration_x = 20000
machine_max_acceleration_y = 20000
machine_max_acceleration_z = 500
machine_max_acceleration_e = 5000
machine_max_feedrate_x = 800
machine_max_feedrate_y = 800
machine_max_feedrate_z = 20
machine_max_feedrate_e = 100
machine_max_jerk_x = 12
machine_max_jerk_y = 12
machine_max_jerk_z = 0.4
machine_max_jerk_e = 2.5
# START_PRINT heats bed and nozzle itself, so PrusaSlicer must not emit its own M190/M109 first.
autoemit_temperature_commands = 0
start_gcode = START_PRINT EXTRUDER_TEMP={first_layer_temperature[initial_extruder]} BED_TEMP={first_layer_bed_temperature[initial_extruder]}
end_gcode = END_PRINT
before_layer_gcode = ;BEFORE_LAYER_CHANGE\nG92 E0
layer_gcode = ;AFTER_LAYER_CHANGE
toolchange_gcode =
