services:
  db:
    image: mysql
    restart: always
    healthcheck:
      test: "exit 0"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kalleprint
    ports:
      - "3306:3306"
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        PRUSA_APPIMAGE_URL: ${PRUSA_APPIMAGE_URL}
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: kalleprint
    depends_on:
      - db
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
   db_data:
